<!doctype html>
<html lang="ja">
<head>

<title>ページが見つかりません — や印工務店</title>

<style>
  :root {
    --paper: var(--yzrs-paper, #f0ebe3); --raised: var(--yzrs-paper-raised, #f6f1e8); --ink: var(--yzrs-ink, #1c1a16);
    --muted: var(--yzrs-muted, #6f675b); --rule: var(--yzrs-separator, #c8bfae); --accent: var(--yzrs-accent, #b5451b);
    --accent-deep: #8e3514; --tint: #f3e2d6; --sub: var(--yzrs-sub, #3f5f7a);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--yzrs-sans, "Noto Sans JP", "Yu Gothic", sans-serif); line-height: 1.8; }
  main { width: min(640px, 100%); margin: 0 auto; padding: 40px 20px 72px; }
  .kicker { margin: 0; font-family: var(--yzrs-mono, ui-monospace, monospace); font-size: 12px; letter-spacing: .12em; color: var(--accent); }
  h1 { margin: 6px 0 10px; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.35; text-wrap: balance; }
  .lead { margin: 0 0 24px; color: var(--muted); }
  .entries { list-style: none; margin: 0 0 28px; padding: 0; display: grid; gap: 10px; }
  .entries a { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--raised); color: var(--ink); text-decoration: none; }
  .entries a:hover { border-color: var(--accent); }
  .entries .txt { flex: 1; min-width: 0; display: grid; }
  .entries b { font-size: 15.5px; line-height: 1.5; }
  .entries small { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .entries .go { color: var(--sub); font-weight: 700; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
  .button { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
  .button:hover { background: var(--accent-deep); }
  .back { display: inline-flex; align-items: center; min-height: 44px; color: var(--sub); font-weight: 700; }
  .note { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
  .note a { color: var(--sub); }
  a:focus-visible { outline: 3px solid var(--sub); outline-offset: 3px; }
</style>
<link rel="stylesheet" href="/styles/yzrs-ui.css" />
<link rel="stylesheet" href="/styles/yzrs-header.css" />
</head>

<main>

  <p class="lead">URLが変わったか、ページが削除された可能性があります。よく使われる入口はこちらです。</p>
  <ul class="entries">
    <li><a href="/guides/hajimete-no-denshi-kousaku-starter-guide/"><span class="txt"><b>はじめての電子工作ガイド</b><small>最初にそろえる道具をステップ順に</small></span><span class="go" aria-hidden="true">→</span></a></li>
    <li><a href="https://apps.yzrswork.com/?yzrs_ref=404-toolbox"><span class="txt"><b>道具箱(Webツール)</b><small>装備ナビ・計算・見分けツール。登録不要</small></span><span class="go" aria-hidden="true">→</span></a></li>
    <li><a href="/times/"><span class="txt"><b>YZRS Times</b><small>技術とものづくりの読み物</small></span><span class="go" aria-hidden="true">→</span></a></li>
    <li><a href="/about/"><span class="txt"><b>工房案内</b><small>運営者情報・お問い合わせ</small></span><span class="go" aria-hidden="true">→</span></a></li>

  <div class="actions">
    <a class="button" href="/">工房トップへ</a>
    <a class="back" href="/" id="back-link">← 前のページに戻る</a>

</main>
<script>
  (function () {
    var back = document.getElementById('back-link');
    if (window.history.length > 1 && document.referrer) {
      back.addEventListener('click', function (event) { event.preventDefault(); window.history.back(); });
    } else {
      back.hidden = true;
    }
  })();
</script>
