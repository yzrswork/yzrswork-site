name: lockfile-node-engine-fix

on:
  push:
    branches:
      - codex/cloudflare-deploy-readiness-v0.1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile metadata only
        run: npm install --package-lock-only
      - name: Confirm root Node engine
        run: node -e "const p=require('./package-lock.json'); if (p.packages[''].engines.node !== '>=22') { console.error(p.packages[''].engines); process.exit(1); }"
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Wrangler dry-run only
        run: npx wrangler deploy --dry-run
      - name: Commit lockfile fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/lockfile-node-engine-fix.yml
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 1
          fi
          git commit -m "chore: align lockfile node engine"
          git push origin HEAD:codex/cloudflare-deploy-readiness-v0.1
